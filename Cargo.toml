[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland"] }
serde = { version = "1", features = ["derive"] }
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25", features = ["png"] }
